<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Processing</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px 16px 48px;
            background-color: #0f172a;
            color: #e5e7eb;
        }
        h1 {
            font-size: 1.8rem;
            margin: 0 0 4px;
            color: #4ade80;
        }
        p.subtitle {
            margin: 0 0 20px;
            color: #9ca3af;
            font-size: 0.95rem;
        }
        .card {
            background: radial-gradient(circle at top left, rgba(74,222,128,0.15), transparent 60%),
                        radial-gradient(circle at bottom right, rgba(56,189,248,0.15), transparent 60%),
                        #020617;
            border-radius: 18px;
            padding: 20px 18px 18px;
            border: 1px solid rgba(148,163,184,0.35);
            box-shadow: 0 24px 60px rgba(15,23,42,0.9);
        }
        .upload-area {
            border-radius: 14px;
            border: 1px dashed rgba(148,163,184,0.7);
            padding: 18px 16px;
            background: rgba(15,23,42,0.85);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .upload-label {
            font-size: 0.95rem;
            color: #e5e7eb;
            font-weight: 500;
        }
        .file-input-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        input[type="file"] {
            display: none;
        }
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(34,197,94,0.35);
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.12s;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(34,197,94,0.4);
            filter: brightness(1.03);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 6px 16px rgba(34,197,94,0.35);
            filter: brightness(0.98);
        }
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: default;
            box-shadow: none;
            transform: none;
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 16px;
            border-radius: 999px;
            border: 1px solid rgba(148,163,184,0.5);
            background: rgba(15, 23, 42, 0.7);
            color: #e5e7eb;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.35);
            transition: transform 0.08s ease-out, box-shadow 0.08s ease-out, filter 0.12s, background 0.12s;
        }
        .btn-secondary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 22px rgba(15, 23, 42, 0.45);
            background: rgba(15, 23, 42, 0.85);
        }
        .btn-secondary:active {
            transform: translateY(0);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.35);
            filter: brightness(0.98);
        }
        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: default;
            box-shadow: none;
            transform: none;
        }
        .file-name {
            font-size: 0.9rem;
            color: #cbd5f5;
        }
        .hint {
            font-size: 0.8rem;
            color: #9ca3af;
        }
        .result-card {
            margin-top: 20px;
        }
        .result-title {
            font-size: 0.95rem;
            color: #e5e7eb;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .result-output {
            background: rgba(2, 6, 23, 0.9);
            border: 1px solid rgba(148,163,184,0.35);
            border-radius: 12px;
            padding: 12px;
            color: #e5e7eb;
            overflow-x: auto;
        }
        .action-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0 14px;
        }
        .result-output table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        .result-output th,
        .result-output td {
            border-bottom: 1px solid rgba(148,163,184,0.2);
            padding: 6px 8px;
            text-align: left;
            vertical-align: top;
        }
        .result-output th {
            color: #bbf7d0;
            font-weight: 600;
        }
        .result-output tr:nth-child(even) td {
            background: rgba(15, 23, 42, 0.4);
        }
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            font-size: 0.9rem;
        }
        .comparison-table th,
        .comparison-table td {
            border: 1px solid rgba(148,163,184,0.35);
            padding: 10px 12px;
            vertical-align: top;
            text-align: left;
        }
        .comparison-table th {
            background: rgba(15, 23, 42, 0.8);
            color: #e2e8f0;
            font-weight: 600;
        }
        .comparison-table td {
            transition: background-color 0.15s ease;
        }
        .comparison-table tr.highlight-standard td[data-col="standard"],
        .comparison-table tr.highlight-nextlevel td[data-col="nextlevel"] {
            background: rgba(37, 99, 235, 0.15);
        }
        .comparison-table tr.highlight-standard td[data-col="source"],
        .comparison-table tr.highlight-nextlevel td[data-col="source"] {
            background: rgba(30, 41, 59, 0.6);
        }
        .source-missing-standard,
        .source-missing-nextlevel {
            border-radius: 6px;
            padding: 0 4px;
            margin: 0 1px;
            transition: background-color 0.15s ease;
        }
        .source-missing-standard,
        .source-missing-nextlevel {
            background: rgba(248, 113, 113, 0.25);
        }
        .role-mismatch {
            background: rgba(248, 113, 113, 0.25);
            border-radius: 6px;
            padding: 2px 6px;
            display: inline-block;
        }
        .word-error {
            background: rgba(248, 113, 113, 0.2);
            border-radius: 6px;
            padding: 0 4px;
            margin: 0 1px;
        }
        .missing-list {
            margin-top: 6px;
            font-size: 0.75rem;
            color: #f87171;
        }
        .overlap-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
            font-size: 0.75rem;
            margin-bottom: 6px;
        }
        .overlap-triangle {
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 10px solid #facc15;
        }
        .accuracy-gauges {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
.gauge-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148,163,184,0.35);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1 1 0;
        }
        .role-gauge-card {
            flex: 1 1 100%;
            border-color: rgba(249, 115, 22, 0.4);
        }
        .gauge {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: conic-gradient(#22c55e 0deg, rgba(148,163,184,0.2) 0deg);
            position: relative;
        }
        .gauge::after {
            content: "";
            position: absolute;
            inset: 12px;
            border-radius: 50%;
            background: rgba(2, 6, 23, 0.95);
            border: 1px solid rgba(148,163,184,0.35);
        }
        .gauge-value {
            position: relative;
            z-index: 1;
            font-weight: 700;
            color: #e2e8f0;
            font-size: 1rem;
        }
        .gauge-meta {
            font-size: 0.75rem;
            color: #94a3b8;
        }
        .gauge-label {
            font-size: 0.85rem;
            color: #e2e8f0;
            text-align: center;
        }
        .progress-card {
            margin-top: 20px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148,163,184,0.35);
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #22c55e, #06b6d4);
            transition: width 0.2s ease-out;
        }
        .progress-meta {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #cbd5f5;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .progress-slider {
            width: 100%;
            accent-color: #4fd1c5;
        }
        .engine-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            color: #e2e8f0;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
    </style>
</head>
<body>
    <main>
        <h1>Call Processing</h1>
        <p class="subtitle">Upload an audio file to continue.</p>
        <div class="engine-badge" id="engineBadge">Engine: loading…</div>
        <section class="card">
            <div class="upload-area">
                <div class="upload-label">Select a file</div>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" name="file" accept="audio/*">
                    <label class="btn-primary" for="fileInput">Upload file</label>
                    <span class="file-name" id="fileName" aria-live="polite"></span>
                </div>
                <div class="hint">Supported: wav, mp3, m4a</div>
            </div>
        </section>
        <section class="card progress-card">
            <div class="result-title">Progress</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-meta">
                <div id="progressText">Progress: 0 / 0</div>
                <div id="progressLabel">Idle</div>
            </div>
        </section>
        <section class="card result-card">
            <div class="result-title">Final Result (Markdown Table)</div>
            <div id="engineSelector" class="action-bar"></div>
            <div class="result-output" id="markdownResult">Waiting for output...</div>
            <div id="accuracyGauges" class="accuracy-gauges" style="display: none;">
                <div class="gauge-card">
                    <div class="gauge" id="standardGauge">
                        <div class="gauge-value" id="standardGaugeValue">0%</div>
                    </div>
                    <div class="gauge-meta" id="standardGaugeMeta">0 / 0</div>
                    <div class="gauge-label">Standard Diarizer Accuracy</div>
                </div>
                <div class="gauge-card">
                    <div class="gauge" id="nextLevelGauge">
                        <div class="gauge-value" id="nextLevelGaugeValue">0%</div>
                    </div>
                    <div class="gauge-meta" id="nextLevelGaugeMeta">0 / 0</div>
                    <div class="gauge-label">NextLevel Diarizer Accuracy</div>
                </div>
                <div class="gauge-card role-gauge-card">
                    <div class="gauge role-gauge" id="nextLevelRoleGauge">
                        <div class="gauge-value" id="nextLevelRoleGaugeValue">0%</div>
                    </div>
                    <div class="gauge-meta" id="nextLevelRoleGaugeMeta">0 / 0</div>
                    <div class="gauge-label">NextLevel Role Accuracy</div>
                </div>
            </div>
            <div style="margin-top: 12px; display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="btn-secondary" id="applyPatchBtn" type="button">Apply Patch</button>
                <button class="btn-secondary" id="copyDialogueBtn" type="button">Copy Dialogue</button>
                <button class="btn-secondary" id="exportJsonBtn" type="button">Export JSON</button>
                <button class="btn-secondary" id="importJsonBtn" type="button">Import JSON</button>
                <button class="btn-secondary" id="runFullTestBtn" type="button">Run Full Test</button>
                <input type="file" id="importJsonInput" accept="application/json,.json" style="display: none;">
            </div>
            <div class="hint" id="testReportStatus" style="margin-top: 8px; display: none;"></div>
            <a class="hint" id="testReportLink" href="#" target="_blank" style="display: none;"></a>
            <div id="comparisonTable" class="result-output" style="margin-top: 16px; display: none;"></div>
            <div style="margin-top: 16px; display: none;" id="groundTruthActions">
                <button class="btn-secondary" id="uploadGroundTruthBtn" type="button">Upload Ground Truth</button>
                <input type="file" id="groundTruthFileInput" accept=".txt,.md" style="display: none;">
                <div class="hint" id="groundTruthProgress" style="margin-top: 8px; display: none;"></div>
                <input class="progress-slider" id="groundTruthProgressBar" type="range" min="0" max="0" value="0" step="1" style="margin-top: 8px; display: none;" disabled>
            </div>
        </section>
    </main>
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const markdownResult = document.getElementById('markdownResult');
        const comparisonTable = document.getElementById('comparisonTable');
        const accuracyGauges = document.getElementById('accuracyGauges');
        const standardGauge = document.getElementById('standardGauge');
        const standardGaugeValue = document.getElementById('standardGaugeValue');
        const standardGaugeMeta = document.getElementById('standardGaugeMeta');
        const nextLevelGauge = document.getElementById('nextLevelGauge');
        const nextLevelGaugeValue = document.getElementById('nextLevelGaugeValue');
        const nextLevelGaugeMeta = document.getElementById('nextLevelGaugeMeta');
        const nextLevelRoleGauge = document.getElementById('nextLevelRoleGauge');
        const nextLevelRoleGaugeValue = document.getElementById('nextLevelRoleGaugeValue');
        const nextLevelRoleGaugeMeta = document.getElementById('nextLevelRoleGaugeMeta');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const progressLabel = document.getElementById('progressLabel');
        const groundTruthActions = document.getElementById('groundTruthActions');
        const uploadGroundTruthBtn = document.getElementById('uploadGroundTruthBtn');
        const runFullTestBtn = document.getElementById('runFullTestBtn');
        const groundTruthFileInput = document.getElementById('groundTruthFileInput');
        const groundTruthProgress = document.getElementById('groundTruthProgress');
        const groundTruthProgressBar = document.getElementById('groundTruthProgressBar');
        const testReportStatus = document.getElementById('testReportStatus');
        const testReportLink = document.getElementById('testReportLink');
        const applyPatchBtn = document.getElementById('applyPatchBtn');
        const copyDialogueBtn = document.getElementById('copyDialogueBtn');
        const exportJsonBtn = document.getElementById('exportJsonBtn');
        const importJsonBtn = document.getElementById('importJsonBtn');
        const importJsonInput = document.getElementById('importJsonInput');
        let lastFormattedDialogue = '';
        let lastPunctuatedDialogue = '';
        let lastWebhookDialogue = '';
        let lastMonoTranscriptEntries = [];
        let lastOverlapSegments = [];
        let isMockMode = false;
        let testStatusTimer = null;

        const IS_USER_DEMO = false;
        if (IS_USER_DEMO) {
            const noop = () => {};
            console.log = noop;
            console.info = noop;
            console.debug = noop;
            console.warn = noop;
        }

        console.log('log version 1');

        const getApiBase = () => {
            const params = new URLSearchParams(window.location.search);
            const explicit = params.get('api_base');
            if (explicit) {
                return explicit.replace(/\/$/, '');
            }
            const host = window.location.hostname || 'localhost';
            return `http://${host}:5005`;
        };
        const API_BASE = getApiBase();

        const logLlmModel = (payload, label) => {
            const modelName = payload?.model || payload?.data?.model || '';
            console.log(`[Stage] ${label} model:`, modelName || 'unknown');
        };

        const dualTranscribers = [
            { id: 'speechmatics', label: 'Speechmatics', transcriber: 'speechmatics' }
        ];
        const markdownByEngine = {};
        const monoTranscriptsByEngine = {};
        let activeEngineId = dualTranscribers[0]?.id || null;

        const updateEngineBadge = () => {
            const badge = document.getElementById('engineBadge');
            if (!badge) {
                return;
            }
            badge.textContent = 'Engine: Speechmatics';
        };

        updateEngineBadge();
        if (applyPatchBtn) {
            applyPatchBtn.addEventListener('click', () => {
                applyPatchFromWebhook();
            });
        }

        const renderEngineSelector = () => {
            const container = document.getElementById('engineSelector');
            if (!container) {
                return;
            }
            if (dualTranscribers.length <= 1) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = dualTranscribers.map((engine) => {
                const isActive = engine.id === activeEngineId;
                const activeClass = isActive ? 'btn-primary' : 'btn-secondary';
                return `<button class="btn ${activeClass}" data-engine="${engine.id}">${engine.label}</button>`;
            }).join('');
            container.querySelectorAll('button[data-engine]').forEach((button) => {
                button.addEventListener('click', () => {
                    activeEngineId = button.getAttribute('data-engine');
                    renderEngineSelector();
                    const markdown = markdownByEngine[activeEngineId] || '';
                    if (markdown) {
                        markdownResult.innerHTML = renderMarkdownTable(markdown);
                    }
                });
            });
        };

        const sanitizeLlmText = (value, options = {}) => {
            if (typeof value !== 'string') {
                return '';
            }
            const { stripNonAscii = false } = options;
            let text = value;
            if (typeof text.normalize === 'function') {
                text = text.normalize('NFKC');
            }
            text = text
                .replace(/\uFFFD/g, '')
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, '')
                .replace(/[\u200B-\u200F\u2060\uFEFF]/g, '');
            if (stripNonAscii) {
                text = text.replace(/[^\x09\x0A\x0D\x20-\x7E]/g, '');
            }
            return text;
        };

        const normalizeSpeakerLabels = (text) => {
            if (typeof text !== 'string') {
                return '';
            }
            return text.replace(/сп[іи]кер/gi, 'Speaker');
        };

        const sanitizeTranscriptPayload = (raw) => {
            if (typeof raw !== 'string') {
                return '';
            }
            const trimmed = raw.trim();
            if (!trimmed.startsWith('{') && !trimmed.startsWith('[')) {
                return normalizeSpeakerLabels(sanitizeLlmText(raw, { stripNonAscii: true }));
            }
            try {
                const parsed = JSON.parse(raw);
                if (parsed && Array.isArray(parsed.transcript)) {
                    parsed.transcript = parsed.transcript.map((line) =>
                        sanitizeLlmText(normalizeSpeakerLabels(line), { stripNonAscii: true })
                    );
                }
                return JSON.stringify(parsed);
            } catch (error) {
                return normalizeSpeakerLabels(sanitizeLlmText(raw, { stripNonAscii: true }));
            }
        };


        const renderMarkdownTable = (markdown) => {
            if (typeof markdown !== 'string') {
                return '<div>No data</div>';
            }
            const lines = markdown
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.length > 0);
            if (lines.length < 2) {
                return `<div>${markdown}</div>`;
            }
            const rows = lines
                .filter((line) => line.startsWith('|'))
                .map((line) => line.replace(/^\||\|$/g, '').split('|').map((cell) => cell.trim()));
            if (rows.length < 2) {
                return `<div>${markdown}</div>`;
            }
            const [header, separator, ...body] = rows;
            if (!separator.every((cell) => /^-+$/.test(cell))) {
                return `<div>${markdown}</div>`;
            }
            const findColumnIndex = (columns, names) => {
                const lowered = columns.map((cell) => cell.toLowerCase());
                return lowered.findIndex((cell) => names.includes(cell));
            };
            const roleIndex = findColumnIndex(header, ['role', 'speaker']);
            const textIndex = findColumnIndex(header, ['text', 'message']);
            const mergedBody = (() => {
                if (roleIndex === -1 || textIndex === -1) {
                    return body;
                }
                const merged = [];
                let prev = null;
                for (const row of body) {
                    if (!prev) {
                        prev = row.slice();
                        continue;
                    }
                    const prevRole = String(prev[roleIndex] || '').trim().toLowerCase();
                    const nextRole = String(row[roleIndex] || '').trim().toLowerCase();
                    if (prevRole && prevRole === nextRole) {
                        const prevText = String(prev[textIndex] || '').trim();
                        const nextText = String(row[textIndex] || '').trim();
                        const combined = [prevText, nextText].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
                        prev[textIndex] = combined;
                        continue;
                    }
                    merged.push(prev);
                    prev = row.slice();
                }
                if (prev) {
                    merged.push(prev);
                }
                return merged;
            })();
            const escapeHtml = (value) => value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
            const thead = `<thead><tr>${header.map((cell) => `<th>${escapeHtml(cell)}</th>`).join('')}</tr></thead>`;
            const tbody = `<tbody>${mergedBody.map((row) => `<tr>${row.map((cell) => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('')}</tbody>`;
            return `<table>${thead}${tbody}</table>`;
        };

        const normalizeTranscript = (text) => (typeof text === 'string' ? text.trim() : '');
        const extractTranscript = (payload) => {
            if (!payload) {
                return '';
            }
            if (typeof payload === 'string') {
                return payload;
            }
            if (Array.isArray(payload)) {
                return payload[0]?.Transcript || '';
            }
            if (typeof payload === 'object') {
                return payload.Transcript || '';
            }
            return '';
        };

        const buildDialogueForMatching = (dialogue) => {
            if (!dialogue) {
                return '';
            }
            const lines = dialogue
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter((line) => line.length > 0);
            const sentenceLines = [];
            const sentenceRegex = /[^.!?]+[.!?]+|[^.!?]+$/g;

            for (const line of lines) {
                const match = line.match(/^(\d{2}:\d{2}\s+Speaker\s+\d+:\s*)(.*)$/);
                if (!match) {
                    sentenceLines.push(line);
                    continue;
                }
                const prefix = match[1];
                const text = match[2].trim();
                sentenceLines.push(line);
                const sentences = text.match(sentenceRegex) || [];
                if (sentences.length === 0) {
                    continue;
                }
                for (const sentence of sentences) {
                    const cleaned = sentence.trim();
                    if (cleaned.length > 0) {
                        sentenceLines.push(`${prefix}${cleaned}`);
                    }
                }
            }
            const uniqueLines = Array.from(new Set(sentenceLines));
            return uniqueLines.join('\n');
        };

        const fixDialoguePunctuation = async (dialogue) => {
            const prompt = `You are a punctuation fixer.

TASK:
- Fix punctuation and sentence boundaries in the dialogue.
- Keep the original meaning and wording.
- Do NOT change timestamps or speaker labels.
- Keep the same line structure: "MM:SS Speaker X: text".
- Return ONLY the corrected dialogue text, nothing else.`;

            const response = await fetch('/api/llm/chat-completions-local', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    messages: [

                if (union === 0) {

                const lengthRatio = Math.min(needleTokens.length, hayTokens.length) / Math.max(needleTokens.length, hayTokens.length);

        const normalizeForCompare = (text) => {
            if (!text) {
                return '';
            }
            let normalized = normalizeTimeUnits(text).toLowerCase();
            for (const [spaced, joined] of COMPOUND_EQUIVALENTS) {
                const spacedPattern = new RegExp(`\\b${spaced.replace(/\s+/g, '\\s+')}\\b`, 'g');
                normalized = normalized.replace(spacedPattern, joined);
            }
            for (const [variant, canonical] of SYNONYM_EQUIVALENTS) {
                const variantPattern = new RegExp(`\\b${variant}\\b`, 'g');
                normalized = normalized.replace(variantPattern, canonical);
            }
            normalized = normalized
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            normalized = normalized.replace(/\d+/g, (match) => match.split('').join(' '));

                .replace(/\s+/g, ' ')

            if (rawTokens.length === 0) {

                joined

                for (const compound of compoundMap) {
                    const slice = rawTokens.slice(index, index + compound.spaced.length);
                    if (slice.length !== compound.spaced.length) {

                    const normalizedSlice = slice.map((token) => normalizeToken(token));
                    if (normalizedSlice.join(' ') === compound.spaced.join(' ')) {

dvice, commands, setup steps, "try", "check", "enter", "connect", "configure", "you can") are Agent, even if phrased politely.\n</hard_rules>\n\nCONTEXT:\nYou are analyzing a dialogue from a call center. The dialogue below is provided as REFERENCE ONLY.\nIMPORTANT: This dialogue may contain transcription errors and missing phrases due to speaker overlaps.\nUse it only as context to understand the conversation flow, but focus on the SPECIFIC REPLICA you need to analyze.\n\nFULL DIALOGUE (for context only):\nformatted_dialogue\n\nSPECIFIC REPLICA TO ANALYZE:\nRepeat Item 2\n\nTASK:\n1. Parse the replica line in format: \"MM:SS Speaker X: [text]\"\n2. Extract the timestamp (MM:SS format)\n3. Extract the speaker label (Speaker 0 or Speaker 1)\n4. Extract the text content\n5. Analyze the text content in the context of the full dialogue to determine the role using the role definitions, filtering rules, characteristics, and examples above\n6. Replace 'Speaker 0' or 'Speaker 1' with 'Agent' or 'Client' based on your analysis\n7. Return ONLY the modified line in the same single-line format:\n   \n   Format: MM:SS [role]: [text]\n\nIMPORTANT:\n- Keep the exact same single-line format: \"MM:SS [role]: [text]\"\n- Use 'Agent' for call center employees\n- Use 'Client' for customers\n- Consider the full dialogue context, but analyze based on the specific replica's content\n- Account for possible transcription errors or overlaps - focus on the meaning and intent\n- Return ONLY the modified line, nothing else\n- Do NOT add empty lines or extra formatting\n`;

                                                ...file1Entries
                                            ], lastOverlapSegments);
                                        }
                                        if (label === 'File2Transcript') {
                                            const file2Entries = parseMonoTranscriptLines(transcriptLines, 'file2');
                                            lastMonoTranscriptEntries = computeOverlaps([
                                                ...lastMonoTranscriptEntries.filter((entry) => entry.source !== 'file2'),
                                                ...file2Entries
                                            ], lastOverlapSegments);
                                        }
                                    } catch (parseError) {
                                        console.log(`[Stage] ${label} transcript parse failed`, parseError);
                                    }
                                    completeStep(`${label} transcript ready`);
                                    return transcriptText;
                                };

                                try {
                                    const punctuatedForWebhook = lastPunctuatedDialogue || sanitizedUpdatedDialogue;
                                    const sanitizedOriginalDialogue = sanitizeLlmText(punctuatedForWebhook, { stripNonAscii: true });
                                    const runs = await Promise.all(dualTranscribers.map(async (engine) => {
                                        const file1Transcript = await sendForTranscription(file1Url, 'File1Transcript', engine.transcriber);
                                        const file2Transcript = await sendForTranscription(file2Url, 'File2Transcript', engine.transcriber);
                                        const sanitizedFile1Transcript = sanitizeTranscriptPayload(file1Transcript);
                                        const sanitizedFile2Transcript = sanitizeTranscriptPayload(file2Transcript);
                                        monoTranscriptsByEngine[engine.id] = {
                                            file1Transcript: sanitizedFile1Transcript,
                                            file2Transcript: sanitizedFile2Transcript
                                        };

                                        const webhookPayload = {
                                            File1Transcript: sanitizedFile1Transcript,
                                            File2Transcript: sanitizedFile2Transcript,
                                            OriginalDialogue1: sanitizedOriginalDialogue
                                        };
                                        console.log(`Final webhook payload (${engine.label}):`, JSON.stringify(webhookPayload, null, 2));
                                        console.log(`[Stage] Final webhook request started (${engine.label})`);
                                        addSteps(1);
                                        const finalResponse = await fetch('https://spsoft.app.n8n.cloud/webhook/diarization-send', {
                                            method: 'POST',
                                            headers: {
                                                'Content-Type': 'application/json'
                                            },
                                            body: JSON.stringify(webhookPayload)
                                        });
                                        console.log(`[Stage] Final webhook response received (${engine.label})`);
                                        console.log(`[Stage] Final webhook status (${engine.label}):`, finalResponse.status);
                                        const finalResponseText = await finalResponse.text();
                                        const responsePreview = finalResponseText && finalResponseText.trim().length > 0
                                            ? finalResponseText
                                            : '<empty>';
                                        console.log(`Final webhook response preview (${engine.label}):`, responsePreview);
                                        console.log(`[Stage] Webhook raw response length (${engine.label}):`, finalResponseText.length);
                                        let webhookMarkdown = '';

                                        try {
                                            const parsedResponse = JSON.parse(finalResponseText);
                                            const responseItem = Array.isArray(parsedResponse) ? parsedResponse[0] : parsedResponse;
                                            const responseText = responseItem?.text || '';
                                            webhookMarkdown = responseText.replace(/```markdown|```/g, '').trim();
                                        } catch (parseError) {
                                            const fencedMatch = finalResponseText.match(/```markdown([\s\S]*?)```/i);
                                            if (fencedMatch) {
                                                webhookMarkdown = fencedMatch[1].trim();
                                            } else {
                                                const tableMatch = finalResponseText.match(/(\|[^\n]*\|\n\|[-:\s|]+\|\n[\s\S]*)/);
                                                webhookMarkdown = tableMatch ? tableMatch[1].trim() : '';
                                            }
                                        }

                                        console.log(`[Stage] Webhook markdown length (${engine.label}):`, webhookMarkdown.length);
                                        if (enablePostprocessor) {
                                            const postprocessorDialogue = markdownToDialogue(webhookMarkdown);
                                            const postprocessorResult = await sendToPostprocessor({
                                                file1Transcript: sanitizedFile1Transcript,
                                                file2Transcript: sanitizedFile2Transcript,
                                                dialogue: postprocessorDialogue
                                            }, engine.label);
                                            if (postprocessorResult?.markdown) {
                                                webhookMarkdown = postprocessorResult.markdown;
                                                console.log(`[Stage] Postprocessor markdown applied (${engine.label})`);
                                            }
                                        } else {
                                            console.log(`[Stage] Postprocessor disabled (${engine.label})`);
                                        }
                                        return { engine, webhookMarkdown };
                                    }));

                                    runs.forEach((run) => {
                                        markdownByEngine[run.engine.id] = run.webhookMarkdown;
                                    });
                                    activeEngineId = activeEngineId || dualTranscribers[0]?.id || null;
                                    renderEngineSelector();

                                    const activeMarkdown = (activeEngineId && markdownByEngine[activeEngineId]) || '';
                                    if (activeMarkdown) {
                                        markdownResult.innerHTML = renderMarkdownTable(activeMarkdown);
                                        groundTruthActions.style.display = 'block';
                                        lastWebhookDialogue = markdownToDialogue(activeMarkdown);
                                        const nextlevelLines = lastWebhookDialogue
                                            .split('\n')
                                            .map((line) => line.trim())
                                            .filter(Boolean);
                                        console.log('[Stage] NextLevel parsed lines:', nextlevelLines.length);
                                        console.log('[Stage] NextLevel parsed sample:', nextlevelLines.slice(0, 3));
                                        console.log('nextlevel_dialogue:', lastWebhookDialogue);
                                    } else {
                                        markdownResult.innerHTML = '<div>No webhook table received.</div>';
                                        groundTruthActions.style.display = 'none';
                                    }
                                    completeStep('Markdown table rendered');
                                    completeStep('Final webhook responses received');
                                } catch (transcriptError) {
                                    console.log(`Error: ${transcriptError?.message || 'Request failed'}`);
                                }
                            } catch (splitError) {
                                console.log(`Error: ${splitError?.message || 'Request failed'}`);
                            }
                        } catch (formattedError) {
                            console.log(`Error: ${formattedError?.message || 'Request failed'}`);
                        }
                    }
                } catch (encodeError) {
                    console.error('Base64 encoding status: failed', encodeError);
                }
            } catch (error) {
                console.error('[Webhook error]', error);
            }
        });
    </script>
</body>
</html>
